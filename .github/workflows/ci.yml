name: CI

on:
 push:
 pull_request:

jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - name: Check out repository
    uses: actions/checkout@v4

   - name: Set up Python
    uses: actions/setup-python@v5
    with:
     python-version: "3.11"

   - name: Install dependencies
    run: |
     python -m pip install --upgrade pip
     pip install -e ".[dev]"

   - name: Run tests
    run: pytest -q

   - name: Run baseline backtest
    run: python -m src.run_backtest

   - name: Generate benchmark reports
    run: python -m src.build_reports
